[plugin]

name="Aetherion Map Editor"
description="Make and edit Aetherion maps as map files (res://maps/<id>/map.json): every wall, floor, stair, light, spawn and prop is a node you can move, resize and set in the Inspector, saved back to the file the game builds from. QA notes pinned on the map are saved for Claude to read and fix."
author="Aetherion Project"
version="1.0"
script="plugin.gd"
