{
	"version": 9,
	"name": "Aetherion",
	"icon": "Icon.png",
	"fileformats": [
		{ "format": "Valve" }
	],
	"filesystem": {
		"searchpath": ".",
		"packageformat": { "extension": ".zip", "format": "zip" }
	},
	"materials": {
		"root": "textures",
		"extensions": [ ".png" ]
	},
	"entities": {
		"definitions": [ "Aetherion/Aetherion.fgd" ],
		"defaultcolor": "0.6 0.6 0.6 1.0",
		"scale": 1
	},
	"tags": {
		"brush": [
			{ "name": "Illusionary", "attribs": [ "transparent" ], "match": "classname", "pattern": "func_illusionary" },
			{ "name": "Stairs", "attribs": [], "match": "classname", "pattern": "func_stairs" },
			{ "name": "Detail", "attribs": [], "match": "classname", "pattern": "func_detail" }
		],
		"brushface": [
			{ "name": "Clip", "attribs": [ "transparent" ], "match": "material", "pattern": "clip*" },
			{ "name": "Skip", "attribs": [ "transparent" ], "match": "material", "pattern": "skip" }
		]
	},
	"faceattribs": {
		"defaults": { "scale": [ 0.125, 0.125 ] },
		"surfaceflags": [],
		"contentflags": []
	},
	"softMapBounds": "-4096 -4096 -1024 4096 4096 2048"
}
